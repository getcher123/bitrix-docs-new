name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          python -m pip install -U pip
          pip install -e 'rag[dev]'
          pip install ruff

      - name: Python lint (ruff)
        run: ruff check rag/src --select E9,F63,F7,F82

      - name: Python unit (pytest)
        run: make test

      - name: Python integration (TestClient)
        run: make test-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OpenAPI validate
        run: npx --yes @apidevtools/swagger-cli validate rag/openapi.yaml

      - name: Frontend install
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Frontend lint
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm run lint

      - name: Frontend unit tests
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm run test

      - name: Frontend build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          cd frontend
          npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: lint_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start api (no migrations, no reindex)
        env:
          RUN_MIGRATIONS: "0"
          MIGRATE_QDRANT_ON_STARTUP: "0"
        run: docker compose up -d api

      - name: Wait for /health
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          docker compose logs api
          exit 1

      - name: Shutdown
        if: always()
        run: docker compose down -v
