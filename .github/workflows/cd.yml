name: Deploy (Amvera)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
      AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
      AMVERA_PROJECT_SLUG: rag-bitrix
      AMVERA_CLI_VERSION: v1.0.6
      AMVERA_HEALTH_URL: ${{ secrets.AMVERA_HEALTH_URL }}
    steps:
      - name: Skip deploy when secrets are missing
        if: ${{ env.AMVERA_USERNAME == '' || env.AMVERA_PASSWORD == '' }}
        run: |
          echo "Missing AMVERA_USERNAME or AMVERA_PASSWORD. Skipping deploy."
          exit 0

      - name: Checkout
        if: ${{ env.AMVERA_USERNAME != '' && env.AMVERA_PASSWORD != '' }}
        uses: actions/checkout@v4

      - name: Install Amvera CLI
        if: ${{ env.AMVERA_USERNAME != '' && env.AMVERA_PASSWORD != '' }}
        run: |
          curl -sSL https://raw.githubusercontent.com/amvera-cloud/cli/master/amvera-install.sh | bash -s -- "${AMVERA_CLI_VERSION}"

      - name: Login
        if: ${{ env.AMVERA_USERNAME != '' && env.AMVERA_PASSWORD != '' }}
        run: amvera login --user "${AMVERA_USERNAME}" --password "${AMVERA_PASSWORD}"

      - name: Rebuild project
        if: ${{ env.AMVERA_USERNAME != '' && env.AMVERA_PASSWORD != '' }}
        run: |
          set -e
          max_retries=5
          for attempt in $(seq 1 $max_retries); do
            echo "Rebuild attempt ${attempt}/${max_retries}..."
            output="$(amvera rebuild --slug "${AMVERA_PROJECT_SLUG}" 2>&1)" && {
              echo "$output"
              exit 0
            }
            code=$?
            echo "$output"
            if echo "$output" | grep -q "409"; then
              if [ "$attempt" -lt "$max_retries" ]; then
                echo "Build already in progress (409). Waiting before retry..."
                sleep 30
                continue
              fi
              echo "Still 409 after ${max_retries} attempts. Skipping rebuild."
              exit 0
            fi
            exit "$code"
          done

      - name: Smoke /health
        if: ${{ env.AMVERA_USERNAME != '' && env.AMVERA_PASSWORD != '' && env.AMVERA_HEALTH_URL != '' }}
        run: |
          echo "Waiting for ${AMVERA_HEALTH_URL}"
          for i in {1..20}; do
            if curl -fsS "${AMVERA_HEALTH_URL}" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 6
          done
          echo "Health check failed"
          exit 1
