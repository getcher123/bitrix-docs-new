<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bitrix RAG Debug UI</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: #f6f7fb;
        color: #101828;
      }
      header {
        padding: 20px 24px;
        background: #111827;
        color: #f9fafb;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.3px;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 18px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      label {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #667085;
        margin-bottom: 6px;
      }
      input[type="text"],
      input[type="number"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d0d5dd;
        font-size: 14px;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .row {
        display: grid;
        gap: 12px;
      }
      .row.cols-2 {
        grid-template-columns: 1fr 1fr;
      }
      .row.cols-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }
      button.secondary {
        background: #0f172a;
      }
      button.ghost {
        background: transparent;
        color: #111827;
        border: 1px solid #d0d5dd;
      }
      pre {
        margin: 0;
        padding: 12px;
        background: #0b1220;
        color: #d0d5dd;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 12px;
      }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: #475467;
      }
      .status {
        font-weight: 600;
      }
      .hint {
        color: #667085;
        font-size: 12px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #344054;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bitrix RAG Debug UI</h1>
    </header>
    <main>
      <section class="card">
        <div class="row cols-2">
          <div>
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" type="text" placeholder="http://localhost:8000" />
          </div>
          <div>
            <label for="timeout">Timeout (ms)</label>
            <input id="timeout" type="number" min="1000" step="1000" value="30000" />
          </div>
        </div>
        <div class="row cols-3" style="margin-top: 12px;">
          <div>
            <label for="query">Query</label>
            <input id="query" type="text" placeholder="How to create a user?" />
          </div>
          <div class="checkbox" style="align-self: end;">
            <input id="ngrokHeader" type="checkbox" />
            <span>Send ngrok-skip-browser-warning</span>
          </div>
          <div class="checkbox" style="align-self: end;">
            <input id="prettyJson" type="checkbox" checked />
            <span>Pretty JSON</span>
          </div>
        </div>
        <div class="actions" style="margin-top: 12px;">
          <button id="healthBtn">GET /health</button>
          <button id="searchBtn">POST /search</button>
          <button id="answerBtn">POST /answer</button>
          <button id="copyCurlBtn" class="ghost">Copy curl</button>
        </div>
        <div class="hint" style="margin-top: 8px;">
          Tip: API serves OpenAPI at <span id="openapiLink">/openapi.json</span>
        </div>
      </section>

      <section class="card">
        <div class="meta">
          <div>Status: <span class="status" id="statusText">idle</span></div>
          <div>HTTP: <span id="httpStatus">-</span></div>
          <div>Time: <span id="timing">-</span></div>
        </div>
        <div style="margin-top: 12px;">
          <label>Response</label>
          <pre id="responseBox">{}</pre>
        </div>
      </section>
    </main>

    <script>
      const baseUrlInput = document.getElementById("baseUrl");
      const timeoutInput = document.getElementById("timeout");
      const queryInput = document.getElementById("query");
      const statusText = document.getElementById("statusText");
      const httpStatus = document.getElementById("httpStatus");
      const timingEl = document.getElementById("timing");
      const responseBox = document.getElementById("responseBox");
      const openapiLink = document.getElementById("openapiLink");
      const ngrokHeader = document.getElementById("ngrokHeader");
      const prettyJson = document.getElementById("prettyJson");

      const storedBase = localStorage.getItem("rag_base_url");
      const originBase = window.location.origin.startsWith("http") ? window.location.origin : "";
      const defaultBase = storedBase || originBase || "http://localhost:8000";
      baseUrlInput.value = defaultBase;
      queryInput.value = queryInput.placeholder;
      updateOpenApiLink();

      baseUrlInput.addEventListener("change", () => {
        localStorage.setItem("rag_base_url", baseUrlInput.value.trim());
        updateOpenApiLink();
      });

      function updateOpenApiLink() {
        const base = sanitizeBaseUrl();
        openapiLink.textContent = base + "/openapi.json";
      }

      function sanitizeBaseUrl() {
        let base = baseUrlInput.value.trim();
        if (!base) {
          base = "http://localhost:8000";
        }
        return base.replace(/\/+$/, "");
      }

      function buildHeaders() {
        const headers = { "Content-Type": "application/json" };
        if (ngrokHeader.checked) {
          headers["ngrok-skip-browser-warning"] = "1";
        }
        return headers;
      }

      async function request(endpoint, options = {}) {
        const controller = new AbortController();
        const timeout = Number(timeoutInput.value) || 30000;
        const timer = setTimeout(() => controller.abort(), timeout);
        const base = sanitizeBaseUrl();
        const url = base + endpoint;
        statusText.textContent = "loading";
        httpStatus.textContent = "-";
        timingEl.textContent = "-";
        responseBox.textContent = "{}";
        const started = performance.now();
        try {
          const resp = await fetch(url, { ...options, signal: controller.signal });
          const duration = Math.round(performance.now() - started);
          timingEl.textContent = duration + " ms";
          httpStatus.textContent = resp.status;
          const text = await resp.text();
          let payload = text;
          try {
            const json = JSON.parse(text);
            payload = prettyJson.checked ? JSON.stringify(json, null, 2) : JSON.stringify(json);
          } catch (err) {
            // keep raw text
          }
          responseBox.textContent = payload;
          statusText.textContent = resp.ok ? "ok" : "error";
        } catch (err) {
          statusText.textContent = "error";
          responseBox.textContent = String(err);
        } finally {
          clearTimeout(timer);
        }
      }

      document.getElementById("healthBtn").addEventListener("click", () => {
        request("/health", { method: "GET" });
      });

      document.getElementById("searchBtn").addEventListener("click", () => {
        const payload = { query: queryInput.value.trim() };
        request("/search", { method: "POST", headers: buildHeaders(), body: JSON.stringify(payload) });
      });

      document.getElementById("answerBtn").addEventListener("click", () => {
        const payload = { query: queryInput.value.trim() };
        request("/answer", { method: "POST", headers: buildHeaders(), body: JSON.stringify(payload) });
      });

      document.getElementById("copyCurlBtn").addEventListener("click", async () => {
        const base = sanitizeBaseUrl();
        const query = queryInput.value.trim() || "";
        const curl = [
          "curl -s -X POST " + base + "/answer",
          "-H 'Content-Type: application/json'",
          "-d '{\"query\":\"" + query.replace(/\"/g, "\\\\\"") + "\"}'",
        ].join(" ");
        try {
          await navigator.clipboard.writeText(curl);
          statusText.textContent = "copied curl";
        } catch (err) {
          responseBox.textContent = curl;
        }
      });
    </script>
  </body>
</html>
