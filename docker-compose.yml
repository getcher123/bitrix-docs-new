services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bitrix_rag
      POSTGRES_USER: bitrix_rag
      POSTGRES_PASSWORD: bitrix_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://bitrix_rag:bitrix_rag@db:5432/bitrix_rag
      VECTOR_BACKEND: pgvector
      VAULT_ROOT: docs
      RAG_DATA_DIR: .rag
      BGE_BASE_URL: ${BGE_BASE_URL:-}
      BGE_EMBED_PATH: ${BGE_EMBED_PATH:-/embed}
      BGE_RERANK_PATH: ${BGE_RERANK_PATH:-/rerank}
    ports:
      - "8000:8000"
    volumes:
      - ./.rag:/app/.rag
      - ./docs:/app/docs:ro
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
